# Standalone package inside the bee-rust repo: its own empty [workspace] table
# keeps it out of the root workspace, like examples/shortlink.
[workspace]

[package]
name = "sharding"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bee_orm = { path = "../../crates/bee_orm", features = ["sqlite"] }
tokio = { version = "1", features = ["full"] }
