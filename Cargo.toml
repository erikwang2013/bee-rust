[workspace]
resolver = "2"
members = [
    "crates/bee_config",
    "crates/bee_config_macro",
    "crates/bee_logs",
    "crates/bee_cache",
    "crates/bee_template",
    "crates/bee_kv",
    "crates/bee_search",
    "crates/bee_graph",
    "crates/bee_tsdb",
    "crates/bee_orm",
    "crates/bee_orm_macro",
    "crates/bee_session",
    "crates/bee_router",
    "crates/bee_cli",
    "crates/bee_rust",
    "examples/hello",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tower = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
async-trait = "0.1"
