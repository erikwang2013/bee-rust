[package]
name = "bee_kv"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
async-trait = { workspace = true }
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt"] }

[features]
redis = ["dep:redis", "dep:deadpool-redis"]
# `tokio-rustls-comp` rather than bare `tls-rustls`: redis 0.27's tokio
# adapter only compiles its TLS variant under the former.
redis-tls = ["redis", "redis/tokio-rustls-comp"]
# deadpool-redis 0.18.0's sentinel config uses `#[serde(...)]` attributes
# outside `cfg_attr`, so its `sentinel` module only compiles when its `serde`
# feature is on as well.
redis-sentinel = ["redis", "deadpool-redis/sentinel", "deadpool-redis/serde"]
redis-cluster = ["redis", "deadpool-redis/cluster"]
memcached = ["dep:memcache"]

[dependencies.redis]
version = "0.27"
optional = true
features = ["tokio-comp", "aio"]

[dependencies.deadpool-redis]
version = "0.18"
optional = true

[dependencies.memcache]
version = "0.17"
optional = true
# The default `tls` feature pulls `openssl`; the crate compiles without it
# (TLS to memcached is unsupported here). Flipping this back re-enables it.
default-features = false

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }

# Build the docs with every feature: the optional backends gate public modules.
[package.metadata.docs.rs]
all-features = true
