[package]
name = "bee_cache"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
async-trait = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt"] }
thiserror.workspace = true

[features]
redis = ["dep:redis", "dep:deadpool-redis"]
memcache = ["dep:memcache"]

[dependencies.redis]
version = "0.27"
optional = true
# `aio` mirrors bee_kv's redis features: the backend runs commands on pooled
# multiplexed connections.
features = ["tokio-comp", "aio"]

[dependencies.deadpool-redis]
version = "0.18"
optional = true

[dependencies.memcache]
version = "0.17"
optional = true
# The default `tls` feature pulls `openssl`; the crate compiles without it
# (TLS to memcached is unsupported here). Flipping this back re-enables it.
default-features = false

# Build the docs with every feature: the optional backends gate public modules.
[package.metadata.docs.rs]
all-features = true
